name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  # Araç sürümleri (sabit)
  TRIVY_IMAGE: ghcr.io/aquasecurity/trivy:0.69.3
  GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1
  SEMGREP_IMAGE: semgrep/semgrep:1.170.0
  # Eşikler (SECURITY-POLICY.md): bunları değiştirmek politikayı değiştirmektir
  BLOCK_SEVERITY: HIGH,CRITICAL
  REPORT_SEVERITY: MEDIUM

jobs:
  lint-test:
    runs-on: [self-hosted, linux]
    steps:
      - name: Kodu indir
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Python ortamını hazırla
        run: |
          docker run --rm -u "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "$PWD/app:/app" -w /app python:3.12-slim \
            sh -c "python -m venv .venv && .venv/bin/pip install -q -r requirements-dev.txt"

      - name: Lint (ruff)
        run: |
          docker run --rm -u "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "$PWD/app:/app" -w /app python:3.12-slim \
            .venv/bin/ruff check --no-cache .

      - name: Unit testler (pytest)
        run: |
          docker run --rm -u "$(id -u):$(id -g)" -e HOME=/tmp \
            -e PYTHONDONTWRITEBYTECODE=1 \
            -v "$PWD/app:/app" -w /app python:3.12-slim \
            .venv/bin/pytest -v -p no:cacheprovider

  secret-scan:
    runs-on: [self-hosted, linux]
    steps:
      - name: Kodu indir (tüm geçmişle)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Gitleaks
        run: |
          docker run --rm -u "$(id -u):$(id -g)" \
            -v "$PWD:/repo" -w /repo \
            "$GITLEAKS_IMAGE" \
            detect --source /repo --redact --verbose --no-banner

  sast:
    runs-on: [self-hosted, linux]
    steps:
      - name: Kodu indir
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Semgrep
        run: |
          docker run --rm -u "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "$PWD:/src" -w /src \
            "$SEMGREP_IMAGE" \
            semgrep scan --config p/default --config p/python \
              --severity ERROR --severity WARNING --metrics=off --error

  dependency-scan:
    runs-on: [self-hosted, linux]
    steps:
      - name: Kodu indir
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Trivy bağımlılıklar (engelleyen)
        run: |
          mkdir -p "$HOME/.cache/trivy"
          docker run --rm -u "$(id -u):$(id -g)" \
            -e TRIVY_CACHE_DIR=/cache \
            -v "$HOME/.cache/trivy:/cache" \
            -v "$PWD:/src:ro" \
            "$TRIVY_IMAGE" \
            fs --scanners vuln --severity "$BLOCK_SEVERITY" \
              --ignore-unfixed --no-progress --exit-code 1 /src

      - name: Trivy bağımlılıklar (MEDIUM raporu, engellemez)
        if: always()
        run: |
          docker run --rm -u "$(id -u):$(id -g)" \
            -e TRIVY_CACHE_DIR=/cache \
            -v "$HOME/.cache/trivy:/cache" \
            -v "$PWD:/src:ro" \
            "$TRIVY_IMAGE" \
            fs --scanners vuln --severity "$REPORT_SEVERITY" \
              --ignore-unfixed --no-progress --exit-code 0 /src

  build-push:
    needs: [lint-test, secret-scan, sast, dependency-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Kodu indir
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: GitHub Container Registry'ye giriş
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: İmajı build et
        run: |
          IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}
          docker build --pull \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            -t "$IMAGE:${GITHUB_SHA::7}" -t "$IMAGE:latest" ./app

      - name: İmajı Trivy ile tara (engelleyen)
        run: |
          IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}
          mkdir -p "$HOME/.cache/trivy"
          docker save "$IMAGE:${GITHUB_SHA::7}" -o "$RUNNER_TEMP/image.tar"
          docker run --rm -u "$(id -u):$(id -g)" \
            -e TRIVY_CACHE_DIR=/cache \
            -v "$HOME/.cache/trivy:/cache" \
            -v "$RUNNER_TEMP:/scan:ro" \
            "$TRIVY_IMAGE" \
            image --input /scan/image.tar --severity "$BLOCK_SEVERITY" \
              --ignore-unfixed --no-progress --exit-code 1

      - name: İmaj MEDIUM raporu (engellemez)
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/image.tar" ]; then
            docker run --rm -u "$(id -u):$(id -g)" \
              -e TRIVY_CACHE_DIR=/cache \
              -v "$HOME/.cache/trivy:/cache" \
              -v "$RUNNER_TEMP:/scan:ro" \
              "$TRIVY_IMAGE" \
              image --input /scan/image.tar --severity "$REPORT_SEVERITY" \
                --ignore-unfixed --no-progress --exit-code 0
          fi

      - name: SBOM üret (CycloneDX)
        run: |
          mkdir -p "$RUNNER_TEMP/sbom"
          docker run --rm -u "$(id -u):$(id -g)" \
            -e TRIVY_CACHE_DIR=/cache \
            -v "$HOME/.cache/trivy:/cache" \
            -v "$RUNNER_TEMP:/scan:ro" \
            -v "$RUNNER_TEMP/sbom:/out" \
            "$TRIVY_IMAGE" \
            image --input /scan/image.tar --format cyclonedx --no-progress \
              --output "/out/sbom-${GITHUB_SHA::7}.cdx.json"

      - name: SBOM doğrula
        run: |
          python3 - <<'PY'
          import glob, json, os, sys
          files = glob.glob(os.environ["RUNNER_TEMP"] + "/sbom/*.cdx.json")
          if not files:
              sys.exit("SBOM dosyası üretilmemiş")
          d = json.load(open(files[0]))
          comps = d.get("components", [])
          libs = [c for c in comps if c.get("type") == "library"]
          print("Format:", d.get("bomFormat"), d.get("specVersion"))
          print("Toplam bileşen:", len(comps), "| kütüphane:", len(libs))
          names = {c.get("name") for c in libs}
          for need in ("fastapi", "starlette"):
              if need not in names:
                  sys.exit("SBOM'da beklenen paket yok: " + need)
          print("SBOM doğrulandı")
          PY

      - name: İmajı registry'ye gönder
        run: |
          IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}
          docker push "$IMAGE:${GITHUB_SHA::7}"
          docker push "$IMAGE:latest"

      - name: SBOM'u arşivle
        uses: actions/upload-artifact@v6
        with:
          name: sbom-${{ github.sha }}
          path: ${{ runner.temp }}/sbom/
          retention-days: 90
          if-no-files-found: error

      - name: Geçici dosyaları ve oturumu temizle
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/image.tar" "$RUNNER_TEMP/sbom"
          docker logout ghcr.io
