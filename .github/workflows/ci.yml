name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-test:
    runs-on: [self-hosted, linux]
    steps:
      - name: Kodu indir
        uses: actions/checkout@v4

      - name: Python ortamını hazırla
        run: |
          docker run --rm -u "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "$PWD/app:/app" -w /app python:3.12-slim \
            sh -c "python -m venv .venv && .venv/bin/pip install -q -r requirements-dev.txt"

      - name: Lint (ruff)
        run: |
          docker run --rm -u "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "$PWD/app:/app" -w /app python:3.12-slim \
            .venv/bin/ruff check --no-cache .

      - name: Unit testler (pytest)
        run: |
          docker run --rm -u "$(id -u):$(id -g)" -e HOME=/tmp \
            -e PYTHONDONTWRITEBYTECODE=1 \
            -v "$PWD/app:/app" -w /app python:3.12-slim \
            .venv/bin/pytest -v -p no:cacheprovider
