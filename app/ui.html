<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IT Asset Portal</title>
  <link rel="stylesheet" href="/ui/app.css">
</head>
<body>
  <header>
    <h1>IT Asset Portal</h1>
    <div class="header-actions">
      <button id="theme-btn" type="button" class="secondary" aria-label="Temayı değiştir">Tema</button>
      <button id="logout" type="button" hidden>Çıkış</button>
    </div>
  </header>

  <main>
    <section id="login-view">
      <form id="login-form">
        <h2>Giriş</h2>
        <label>Kullanıcı adı
          <input id="username" autocomplete="username" required>
        </label>
        <label>Parola
          <input id="password" type="password" autocomplete="current-password" required>
        </label>
        <button type="submit">Giriş yap</button>
        <p id="login-error" class="error" role="alert"></p>
      </form>
    </section>

    <section id="app-view" hidden>
      <div class="stats">
        <div class="stat" data-filter=""><span class="num" id="s-total">0</span><span class="label">Toplam cihaz</span></div>
        <div class="stat active" data-filter="active"><span class="num" id="s-active">0</span><span class="label">Kullanımda</span></div>
        <div class="stat in_repair" data-filter="in_repair"><span class="num" id="s-in_repair">0</span><span class="label">Tamirde</span></div>
        <div class="stat retired" data-filter="retired"><span class="num" id="s-retired">0</span><span class="label">Emekli</span></div>
      </div>

      <div class="toolbar">
        <h2>Cihazlar <span id="count"></span></h2>
        <div class="buttons">
          <button id="csv-btn" type="button" class="secondary">CSV indir</button>
          <button id="print-btn" type="button" class="secondary">Yazdır</button>
          <button id="new-btn" type="button">Yeni cihaz</button>
        </div>
      </div>

      <form id="device-form" hidden>
        <h3 id="form-title">Yeni cihaz</h3>
        <label>Ad <input id="f-name" maxlength="100" required></label>
        <label>Demirbaş etiketi <input id="f-asset-tag" maxlength="50" required></label>
        <label>Tür <input id="f-type" maxlength="50" required placeholder="laptop, telefon, yazıcı"></label>
        <label>Sahibi <input id="f-owner" maxlength="100"></label>
        <label>Konum <input id="f-location" maxlength="100"></label>
        <label>Durum
          <select id="f-status">
            <option value="active">Kullanımda</option>
            <option value="in_repair">Tamirde</option>
            <option value="retired">Emekli</option>
          </select>
        </label>
        <div class="buttons">
          <button type="submit">Kaydet</button>
          <button id="cancel-btn" type="button" class="secondary">İptal</button>
        </div>
        <p id="form-error" class="error" role="alert"></p>
      </form>

      <div class="filters">
        <input id="search" type="search" placeholder="Ara: ad, sahibi, etiket, konum" aria-label="Ara">
        <select id="filter-status" aria-label="Duruma göre filtrele">
          <option value="">Tüm durumlar</option>
          <option value="active">Kullanımda</option>
          <option value="in_repair">Tamirde</option>
          <option value="retired">Emekli</option>
        </select>
        <select id="filter-type" aria-label="Türe göre filtrele">
          <option value="">Tüm türler</option>
        </select>
        <div class="view-toggle">
          <button id="view-list" type="button" class="secondary active">Liste</button>
          <button id="view-owner" type="button" class="secondary">Kimde ne var</button>
        </div>
      </div>

      <div id="bulk-bar" class="bulk-bar" hidden>
        <strong><span id="bulk-count">0</span> cihaz seçili</strong>
        <input id="bulk-owner" maxlength="100" placeholder="Yeni sahibi" aria-label="Yeni sahibi">
        <button id="bulk-owner-btn" type="button">Sahibini ata</button>
        <button id="bulk-owner-clear" type="button" class="secondary">Sahibini boşalt</button>
        <select id="bulk-status" aria-label="Yeni durum">
          <option value="">Durum seç</option>
          <option value="active">Kullanımda</option>
          <option value="in_repair">Tamirde</option>
          <option value="retired">Emekli</option>
        </select>
        <button id="bulk-status-btn" type="button">Durumu uygula</button>
        <button id="bulk-delete" type="button" class="danger">Seçilenleri sil</button>
      </div>

      <p id="list-error" class="error" role="alert"></p>
      <p id="empty" hidden></p>

      <div id="list-view" class="table-wrap">
        <table>
          <thead>
            <tr>
              <th class="sel"><input type="checkbox" id="select-all" aria-label="Hepsini seç"></th>
              <th><button type="button" class="th-btn" data-sort="name">Ad</button></th>
              <th><button type="button" class="th-btn" data-sort="asset_tag">Demirbaş etiketi</button></th>
              <th><button type="button" class="th-btn" data-sort="device_type">Tür</button></th>
              <th><button type="button" class="th-btn" data-sort="owner">Sahibi</button></th>
              <th><button type="button" class="th-btn" data-sort="location">Konum</button></th>
              <th><button type="button" class="th-btn" data-sort="status">Durum</button></th>
              <th>İşlem</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <div id="owner-view" class="owner-grid" hidden></div>
    </section>
  </main>

  <footer>Sürüm: <span id="version">-</span></footer>

  <dialog id="confirm-dialog">
    <p id="confirm-text"></p>
    <div class="buttons">
      <button id="confirm-yes" type="button" class="danger">Evet</button>
      <button id="confirm-no" type="button" class="secondary">Vazgeç</button>
    </div>
  </dialog>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script src="/ui/app.js"></script>
</body>
</html>
