# Depo Stok dağıtım Compose dosyası: imaj registry'den gelir, tüm servisler sertleştirilmiştir.
# Proje adı sabit: myapp yığınından bağımsız çalışır ve birbirini etkilemez.
name: depo

x-hardening: &hardening
  restart: unless-stopped
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  db:
    <<: *hardening
    image: postgres:16-alpine
    user: "70:70"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /var/run/postgresql:rw,noexec,nosuid,size=16m
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    mem_limit: 384m
    pids_limit: 300
    cpu_shares: 512
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [backend]

  app:
    <<: *hardening
    image: ${APP_IMAGE:?APP_IMAGE tanımlı olmalı}
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    environment:
      APP_IMAGE: ${APP_IMAGE}
    env_file: .env
    mem_limit: 256m
    pids_limit: 200
    cpu_shares: 512
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    networks: [backend, frontend]

  nginx:
    <<: *hardening
    image: nginxinc/nginx-unprivileged:stable-alpine
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    ports:
      - "9443:8443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./nginx/metrics-allow.conf:/etc/nginx/metrics-allow.conf:ro
      - ./nginx/htpasswd:/etc/nginx/auth/htpasswd:ro
    mem_limit: 128m
    pids_limit: 100
    cpu_shares: 512
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks: [frontend]

networks:
  backend:
    internal: true
  frontend:

volumes:
  pgdata:
