# Depo Stok: parola koruması nginx'te (HTTP Basic Auth), uygulamada değil.
# İstek hızı sınırı, parola deneme-yanılmasını yavaşlatır (limit_req kimlik denetiminden önce çalışır).
limit_req_zone $binary_remote_addr zone=depo:10m rate=5r/s;
limit_req_status 429;

server {
    listen 8443 ssl;
    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 64k;

    # Parolasız açık uçlar: sağlık ve sürüm bilgisi (stok verisi içermez)
    location = /health {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
    }

    location = /version {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
    }

    # Metrikler sadece izin verilen IP'ye açık (metrics-allow.conf makineye özeldir)
    location = /metrics {
        include /etc/nginx/metrics-allow.conf;
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
    }

    # Geri kalan her şey (arayüz ve API) parola ister
    location / {
        limit_req zone=depo burst=30 nodelay;
        auth_basic           "Depo Stok";
        auth_basic_user_file /etc/nginx/auth/htpasswd;

        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # İstemcinin gönderdiği başlığın üzerine yazılır: uygulama yalnızca nginx'in doğruladığı adı görür
        proxy_set_header X-Remote-User $remote_user;
    }
}

# Konteyner sağlık kontrolü için: yalnızca konteynerin kendi içinden (127.0.0.1) erişilir
server {
    listen 127.0.0.1:8081;
    access_log off;
    location = /healthz {
        return 200 "ok\n";
    }
}
