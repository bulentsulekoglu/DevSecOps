<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Depo Stok</title>
  <link rel="stylesheet" href="/ui.css">
</head>
<body>
  <header>
    <h1>Depo Stok</h1>
    <span class="who">Kullanıcı: <b id="who">-</b></span>
  </header>

  <main>
    <p id="overdue-banner" class="banner" role="alert" hidden></p>
    <nav class="tabs noprint" aria-label="Bölümler">
      <button id="tab-stock" type="button" class="active">Stok</button>
      <button id="tab-count" type="button">Sayım</button>
      <button id="tab-loans" type="button">Ödünç verilenler</button>
    </nav>

    <section class="cards noprint" aria-label="Özet">
      <div class="card"><span id="c-products">-</span><small>Ürün çeşidi</small></div>
      <div class="card"><span id="c-units">-</span><small>Toplam adet</small></div>
      <div class="card warn"><span id="c-low">-</span><small>Kritik stok</small></div>
      <div class="card bad"><span id="c-empty">-</span><small>Tükenen</small></div>
      <div class="card warn"><span id="c-loans">-</span><small>Geri alınacak (<b id="c-overdue">-</b> gecikmiş)</small></div>
    </section>

    <div id="view-stock">
    <section class="toolbar noprint">
      <input id="q" type="search" placeholder="Ara: ad, kod, barkod, kategori, konum" autocomplete="off" autofocus>
      <select id="cat"><option value="">Tüm kategoriler</option></select>
      <label class="chk"><input id="low" type="checkbox"> Yalnızca kritik</label>
      <button id="scan-btn" type="button">Kamera ile tara</button>
      <button id="new-btn" type="button">Yeni ürün</button>
      <a class="btn" href="/api/export.csv">CSV indir</a>
      <button id="import-btn" type="button">CSV yükle</button>
      <input id="import-file" type="file" accept=".csv,text/csv" hidden>
      <button id="print-btn" type="button">Listeyi yazdır</button>
    </section>

    <p id="msg" class="noprint" role="status"></p>
    <section id="scanner" class="panel noprint" hidden>
      <video id="scan-video" playsinline muted></video>
      <p id="scan-info"></p>
      <button id="scan-stop" type="button">Kamerayı kapat</button>
    </section>

    <table>
      <thead>
        <tr><th>Ürün</th><th>Kod</th><th>Kategori</th><th>Konum</th><th class="num">Miktar</th><th class="num">Minimum</th><th>İşlem</th></tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="pager noprint">
      <button id="prev" type="button">Önceki</button>
      <span id="page-info"></span>
      <button id="next" type="button">Sonraki</button>
    </div>

    </div>

    <div id="view-count" hidden>
      <section class="toolbar">
        <input id="count-q" type="search" placeholder="Rafı veya ürünü bul (konum, ad, kod)" autocomplete="off">
        <button id="count-load" type="button">Listele</button>
      </section>
      <table>
        <thead>
          <tr><th>Ürün</th><th>Konum</th><th class="num">Sistemde</th><th class="num">Sayılan</th><th class="num">Fark</th></tr>
        </thead>
        <tbody id="count-rows"></tbody>
      </table>
      <section class="toolbar">
        <input id="count-note" type="text" maxlength="150" placeholder="Sayım açıklaması (ör. Raf A sayımı)">
        <button id="count-apply" type="button" class="primary">Farkları kaydet</button>
      </section>
    </div>

    <div id="view-loans" hidden>
      <section class="toolbar">
        <select id="loan-status">
          <option value="open">Geri alınmayı bekleyenler</option>
          <option value="returned">Geri alınanlar</option>
          <option value="all">Hepsi</option>
        </select>
        <button id="loan-new-btn" type="button">Yeni kayıt</button>
      </section>
      <form id="loan-form" hidden autocomplete="off"></form>
      <table>
        <thead>
          <tr><th>Ne</th><th class="num">Adet</th><th>Kime</th><th>Verildiği</th><th>Geri tarihi</th><th>Not</th><th>İşlem</th></tr>
        </thead>
        <tbody id="loan-rows"></tbody>
      </table>
    </div>

    <section id="panel" class="panel noprint" hidden>
      <h2 id="panel-title"></h2>
      <form id="form" autocomplete="off"></form>
      <div id="history"></div>
      <button id="panel-close" type="button">Kapat</button>
    </section>

    <section id="label" hidden>
      <div id="label-name"></div>
      <div id="label-code"></div>
      <div id="label-loc"></div>
    </section>
  </main>

  <script src="/ui.js" defer></script>
</body>
</html>
