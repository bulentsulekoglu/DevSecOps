modules:
  http_2xx:
    prober: http
    timeout: 5s
    http:
      method: GET
      valid_status_codes: [200]
      fail_if_body_not_matches_regexp:
        - '"status":"ok"'
      tls_config:
        # Staging ve production self-signed sertifika kullanıyor. Sertifika
        # doğrulaması kapalı; gerçek CA sertifikasına geçilince kaldırılacak.
        insecure_skip_verify: true
