services:
  prometheus:
    image: prom/prometheus:v3.13.5
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./targets:/etc/prometheus/targets:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    networks: [monitoring]

  alertmanager:
    image: prom/alertmanager:v0.33.1
    restart: unless-stopped
    # Şifre dosyasını yalnızca bu kullanıcı okuyabildiği için root olmayan kendi kimliğinle çalışır
    user: "${ALERTMANAGER_USER:?önce monitoring/setup-alerting.sh çalıştırılmalı}"
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./alertmanager/generated/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./secrets:/etc/alertmanager/secrets:ro
      - ./alertmanager/data:/alertmanager
    ports:
      - "127.0.0.1:9093:9093"
    networks: [monitoring]

  # Sadece textfile toplayıcısı: runner'daki yedek metrik dosyasını sunar
  backup-metrics:
    image: prom/node-exporter:v1.9.1
    restart: unless-stopped
    command:
      - --collector.disable-defaults
      - --collector.textfile
      - --collector.textfile.directory=/textfile
      - --web.listen-address=:9100
    volumes:
      - ${HOME}/backup-store/metrics:/textfile:ro
    networks: [monitoring]

  blackbox:
    image: prom/blackbox-exporter:v0.28.0
    restart: unless-stopped
    command: ["--config.file=/etc/blackbox/blackbox.yml"]
    volumes:
      - ./blackbox/blackbox.yml:/etc/blackbox/blackbox.yml:ro
    networks: [monitoring]

  grafana:
    image: grafana/grafana:13.1.0
    restart: unless-stopped
    env_file: .env
    environment:
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana-dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    networks: [monitoring]

networks:
  monitoring:

volumes:
  prometheus-data:
  grafana-data:
