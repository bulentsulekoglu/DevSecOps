groups:
  - name: erisilebilirlik
    rules:
      - alert: ServisErisilemiyor
        expr: probe_success{job="blackbox-http"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.env }} {{ $labels.app }} servisi erişilemiyor"
          description: "{{ $labels.env }} ortamında {{ $labels.app }} için /health kontrolü 1 dakikadır başarısız."

      - alert: SunucuMetrikleriGelmiyor
        expr: up{job="node"} == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.env }} sunucusundan metrik gelmiyor"
          description: "{{ $labels.env }} üzerindeki node_exporter 2 dakikadır yanıt vermiyor (sunucu kapalı ya da ağ sorunu olabilir)."

      - alert: UygulamaMetrikleriGelmiyor
        expr: up{job=~"app|depo"} == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.env }} {{ $labels.app }} uygulamasından metrik gelmiyor"
          description: "{{ $labels.env }} ortamında {{ $labels.app }} uygulamasının /metrics adresi 2 dakikadır yanıt vermiyor."

  - name: kaynaklar
    rules:
      - alert: YuksekCPU
        expr: 100 - (avg by (env) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.env }} CPU kullanımı yüksek"
          description: "{{ $labels.env }} CPU kullanımı 10 dakikadır %85 üzerinde (şu an %{{ printf \"%.0f\" $value }})."

      - alert: YuksekRAM
        expr: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 > 90
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.env }} RAM kullanımı yüksek"
          description: "{{ $labels.env }} RAM kullanımı 10 dakikadır %90 üzerinde (şu an %{{ printf \"%.0f\" $value }})."

      - alert: DiskDoluyor
        expr: (1 - node_filesystem_avail_bytes{mountpoint="/",fstype!~"tmpfs|overlay|squashfs"} / node_filesystem_size_bytes{mountpoint="/",fstype!~"tmpfs|overlay|squashfs"}) * 100 > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.env }} diski doluyor"
          description: "{{ $labels.env }} kök disk kullanımı %85 üzerinde (şu an %{{ printf \"%.0f\" $value }})."

      - alert: DiskDolacak
        expr: predict_linear(node_filesystem_avail_bytes{mountpoint="/",fstype!~"tmpfs|overlay|squashfs"}[1h], 4 * 3600) < 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.env }} diski 4 saat içinde dolacak"
          description: "{{ $labels.env }} kök diski son 1 saatlik gidişatla 4 saat içinde dolacak."

  - name: http
    rules:
      - alert: SunucuHatalari5xx
        expr: sum by (env, app) (increase(http_requests_total{job=~"app|depo",status=~"5.."}[5m])) >= 3
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.env }} {{ $labels.app }} uygulaması sunucu hatası (5xx) veriyor"
          description: "{{ $labels.env }} ortamında {{ $labels.app }} son 5 dakikada en az 3 adet 5xx yanıtı döndü."

  - name: yedekleme
    rules:
      - alert: YedekBayat
        expr: time() - backup_latest_timestamp_seconds > 129600
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.env }} {{ $labels.app }} için yeni yedek gelmiyor"
          description: "{{ $labels.env }} {{ $labels.app }} en yeni yedeği {{ $value | humanizeDuration }} önce alınmış (sınır 36 saat). VM'deki cron ya da runner'ın çekme işi çalışmıyor olabilir."

      - alert: YedekCekmeCalismiyor
        expr: time() - backup_pull_last_run_timestamp_seconds > 129600
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.env }} yedek çekme işi çalışmıyor"
          description: "Runner'ın yedek çekme işi {{ $value | humanizeDuration }}dir çalışmamış (runner'daki cron kontrol edilmeli)."

      - alert: YedekCekmeBasarisiz
        expr: backup_pull_success == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.env }} yedekleri çekilemedi"
          description: "Runner {{ $labels.env }} VM'inden yedekleri çekemedi ya da bir yedeğin sha256 doğrulaması başarısız (~/backup-store/pull.log)."

      - alert: YedekGeriYuklemeBasarisiz
        expr: backup_verify_success == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.env }} {{ $labels.app }} yedeği geri yüklenemiyor"
          description: "{{ $labels.env }} {{ $labels.app }} en yeni yedeğinin geçici veritabanında geri yükleme sınaması başarısız. Yedek kullanılamaz olabilir (~/backup-store/verify.log)."

      - alert: YedekSinamasiCalismiyor
        expr: time() - backup_verify_last_run_timestamp_seconds > 129600
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.env }} {{ $labels.app }} yedek sınaması çalışmıyor"
          description: "Geri yükleme sınaması {{ $value | humanizeDuration }}dir çalışmamış (runner'daki cron kontrol edilmeli)."

      - alert: YedekMetrikleriGelmiyor
        expr: up{job="backup"} == 0 or absent(backup_latest_timestamp_seconds)
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Yedek metrikleri gelmiyor"
          description: "Runner'daki yedek metrik dosyası ya da onu sunan konteyner yanıt vermiyor, yedek uyarıları kör kalmış olabilir."
