global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # CPU, RAM, disk: staging ve production VM'lerindeki node_exporter
  - job_name: node
    file_sd_configs:
      - files: ['/etc/prometheus/targets/node.yml']

  # Servis erişilebilirliği: blackbox exporter dışarıdan /health'i yoklar
  - job_name: blackbox-http
    metrics_path: /probe
    params:
      module: [http_2xx]
    file_sd_configs:
      - files: ['/etc/prometheus/targets/http.yml']
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

  # Uygulama metrikleri (HTTP istek sayısı, hata oranı, gecikme): nginx üzerinden /metrics
  - job_name: app
    scheme: https
    metrics_path: /metrics
    tls_config:
      insecure_skip_verify: true  # self-signed sertifika
    file_sd_configs:
      - files: ['/etc/prometheus/targets/app.yml']

  - job_name: alertmanager
    static_configs:
      - targets: ['alertmanager:9093']
